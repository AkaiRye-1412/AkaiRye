                  - text: 张力在提速段波动，通常同时与
                  - strong [ref=e570]: 检测信号、卷径计算、伺服响应
                  - text: 三处有关。结合历史记录与手册，建议按以下顺序排查：
                - list [ref=e571]:
                  - listitem [ref=e572]:
                    - strong [ref=e573]: 先校验张力检测信号
                    - text: ：检查传感器零点与编码器联轴器，排除打滑或零点漂移。星河纸业 11-24 的记录中，更换编码器并重新标定后波动从 ±6% 降到 ±1.5%。
                    - button "1" [ref=e574] [cursor=pointer]
                    - button "2" [ref=e575] [cursor=pointer]
                  - listitem [ref=e576]:
                    - strong [ref=e577]: 核对卷径与锥度参数
                    - text: ：实测卷径与计算值偏差会造成高速段张力持续偏大。高创 CDV3000 的张力锥度参数为 P-04.12（默认 50%，现场按工艺改为 68%），卷径补偿模式见 §7.4。
                    - button "3" [ref=e578] [cursor=pointer]
                    - button "4" [ref=e579] [cursor=pointer]
                  - listitem [ref=e580]:
                    - strong [ref=e581]: 检查加减速段的伺服响应
                    - text: ：确认位置环 / 速度环增益未因更换硬件而恢复默认。若是 EtherCAT 轴，同时核对 PDO 周期与主站一致。
                  - listitem [ref=e582]:
                    - strong [ref=e583]: 记录波形做对比
                    - text: ：分别在 600 / 800 / 1200 m/min 采集张力曲线，确认波动随速度变化的拐点，再决定是否需要调整机械或参数。
